services:
  db:
    image: postgres:16-alpine
    container_name: security_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: securityplus
      POSTGRES_USER: secplus_user
      POSTGRES_PASSWORD: secplus_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secplus_user -d securityplus"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: security_backend
    restart: unless-stopped
    environment:
      DEBUG: "False"
      SECRET_KEY: "django-insecure-dev-only-change-in-production"
      ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173"
      DB_ENGINE: "django.db.backends.postgresql"
      DB_NAME: "securityplus"
      DB_USER: "secplus_user"
      DB_PASSWORD: "secplus_dev_password"
      DB_HOST: "db"
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: security_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
