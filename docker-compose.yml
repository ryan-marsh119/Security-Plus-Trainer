services:
  db:
    image: postgres:16-alpine
    container_name: security_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: securityplus
      POSTGRES_USER: secplus_user
      POSTGRES_PASSWORD: secplus_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secplus_user -d securityplus"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Single combined service — the exact image we deploy to Railway. gunicorn ->
  # Django serves the API/admin AND the pre-built React SPA from one origin.
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: security_web
    restart: unless-stopped
    environment:
      DEBUG: "False"
      # Local stack runs over plain HTTP, so disable secure cookies (prod/Railway
      # omits these and they default to True via `not DEBUG`).
      SESSION_COOKIE_SECURE: "False"
      CSRF_COOKIE_SECURE: "False"
      SECRET_KEY: "django-insecure-dev-only-change-in-production"
      ALLOWED_HOSTS: "localhost,127.0.0.1,web"
      PORT: "8000"
      DB_ENGINE: "django.db.backends.postgresql"
      DB_NAME: "securityplus"
      DB_USER: "secplus_user"
      DB_PASSWORD: "secplus_dev_password"
      DB_HOST: "db"
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  postgres_data:
